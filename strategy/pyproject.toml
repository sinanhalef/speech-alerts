[project]
name = "strategy-backtest"
version = "0.1.0"
description = "Offline backtest: do the President's stock mentions (as detected by speechalerts) move prices?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "speechalerts",
    "yfinance>=0.2.50",
    "pandas>=2.2",
]

[project.scripts]
backtest = "backtest.cli:main"

[tool.uv.sources]
speechalerts = { path = "..", editable = true }

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "backtest"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
