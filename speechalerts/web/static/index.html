<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Alerts</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#171b22; --fg:#e6e8eb; --dim:#8b949e; --yellow:#e3b341; --green:#3fb950; --red:#f85149; --cyan:#58a6ff; --mag:#d2a8ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid #262c36; position:sticky; top:0; background:var(--bg); }
  header h1 { font-size:16px; margin:0; }
  #status { color:var(--dim); font-size:13px; }
  #status .live { color:var(--green); font-weight:600; }
  main { display:grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap:16px; padding:16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid #262c36; border-radius:8px; padding:12px 14px; min-height:200px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:0 0 10px; }
  .alert { border-left:3px solid var(--yellow); padding:8px 10px; margin:0 0 8px; background:#12161d; border-radius:4px; }
  .alert.confirmed { border-color:var(--green); }
  .alert.retracted { border-color:var(--red); opacity:.6; }
  .alert .top { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
  .alert .state { font-size:11px; font-weight:700; letter-spacing:.05em; }
  .alert.headsup .state { color:var(--yellow); } .alert.confirmed .state { color:var(--green); } .alert.retracted .state { color:var(--red); }
  .alert .entity { font-weight:700; font-size:15px; }
  .alert .tickers { color:var(--cyan); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .alert .lat { color:var(--mag); margin-left:auto; font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  .alert .time { color:var(--dim); font-size:12px; }
  .alert .summary { margin-top:4px; }
  .alert .quote { color:var(--dim); font-style:italic; margin-top:2px; }
  .stance-positive { color:var(--green); } .stance-negative { color:var(--red); } .stance-neutral { color:var(--dim); }
  #transcript { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; color:var(--dim); max-height:70vh; overflow:auto; }
  #transcript .final { color:var(--fg); }
  #transcript .final.q { color:var(--dim); font-style:italic; }
  #transcript .who { display:inline-block; width:1.2em; color:var(--dim); }
  #transcript p { margin:0 0 6px; }
  #interim { color:var(--dim); font-style:italic; }
  .empty { color:var(--dim); font-style:italic; }
  .disclaimer { padding:0 20px 20px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Speech Alerts</h1>
  <div id="status">connecting…</div>
</header>
<main>
  <section>
    <h2>Alerts</h2>
    <div id="alerts"><p class="empty">No alerts yet.</p></div>
  </section>
  <section>
    <h2>Transcript</h2>
    <div id="transcript"></div>
    <p id="interim"></p>
  </section>
</main>
<p class="disclaimer">Factual record of what was said, with timestamps. Not investment advice. Transcripts are machine-generated and may contain errors.</p>
<script>
  const alertsEl = document.getElementById('alerts');
  const transcriptEl = document.getElementById('transcript');
  const interimEl = document.getElementById('interim');
  const statusEl = document.getElementById('status');
  const seen = new Map();

  function fmtTime(t) { return new Date(t * 1000).toLocaleTimeString(); }

  function renderAlert(a) {
    let el = seen.get(a.id);
    if (!el) {
      el = document.createElement('div');
      seen.set(a.id, el);
      const empty = alertsEl.querySelector('.empty');
      if (empty) empty.remove();
      alertsEl.prepend(el);
    }
    el.className = 'alert ' + a.state;
    const stance = a.state === 'confirmed' ? `<span class="stance-${a.stance}">${a.stance} · ${a.action} · ${(a.confidence*100).toFixed(0)}%</span>` : '';
    el.innerHTML = `
      <div class="top">
        <span class="state">${a.state.toUpperCase()}</span>
        <span class="entity">${a.entity}</span>
        <span class="tickers">${(a.tickers||[]).join(' ')}</span>
        ${stance}
        <span class="lat">+${a.latency_ms} ms</span>
      </div>
      <div class="time">${fmtTime(a.t_alert)} · audio ${a.t_audio.toFixed(1)}s${a.count > 1 ? ' · ×' + a.count : ''}</div>
      ${a.state === 'confirmed' ? `<div class="summary">${a.summary}</div>` : ''}
      <div class="quote">“${a.quote}”</div>`;
    // A confirmation or retraction supersedes its heads-up; mark the parent.
    if (a.parent_id && seen.has(a.parent_id)) {
      const parent = seen.get(a.parent_id);
      parent.classList.add(a.state === 'retracted' ? 'retracted' : 'confirmed');
      parent.querySelector('.state').textContent = a.state === 'retracted' ? 'RETRACTED' : 'HEADS-UP ✓';
    }
  }

  function renderSegment(s) {
    if (s.is_final) {
      const p = document.createElement('p');
      p.className = 'final' + (s.speaker_label === 'Q' ? ' q' : '');
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = s.speaker_label || '';
      p.appendChild(who);
      p.appendChild(document.createTextNode(`${s.t_audio_start.toFixed(1)}s  ${s.text}`));
      transcriptEl.appendChild(p);
      while (transcriptEl.children.length > 80) transcriptEl.removeChild(transcriptEl.firstChild);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
      interimEl.textContent = '';
    } else {
      interimEl.textContent = s.text;
    }
  }

  function renderStatus(st) {
    const live = st.state === 'listening' ? '<span class="live">● LIVE</span> ' : (st.state || '');
    statusEl.innerHTML = `${live}${st.title ? ' ' + st.title : ''}${st.source ? ' <small>(' + st.source + ')</small>' : ''}`;
  }

  fetch('/api/transcript').then(r => r.json()).then(list => list.forEach(renderSegment));

  const es = new EventSource('/events');
  es.addEventListener('alert', e => renderAlert(JSON.parse(e.data)));
  es.addEventListener('segment', e => renderSegment(JSON.parse(e.data)));
  es.addEventListener('status', e => renderStatus(JSON.parse(e.data)));
  es.onerror = () => { statusEl.textContent = 'disconnected, retrying…'; };
</script>
</body>
</html>
